version: '3.9'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      --listen-peer-urls=http://0.0.0.0:2380
      --listen-client-urls=http://0.0.0.0:2379
      --advertise-client-urls=http://etcd:2379
      --initial-advertise-peer-urls=http://etcd:2380
      --initial-cluster=default=http://etcd:2380
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9010:9000"
      - "9011:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.0
    restart: unless-stopped
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5

  aegis-api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD}@postgres/aegis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      EMBEDDING_PROVIDER: openai
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      REPORTS_DIR: /app/reports
    volumes:
      - reports_data:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  aegis-worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A aegis.worker.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD}@postgres/aegis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      EMBEDDING_PROVIDER: openai
      SECRET_KEY: ${SECRET_KEY}
      REPORTS_DIR: /app/reports
    volumes:
      - reports_data:/app/reports
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  aegis-ui:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - aegis-api

  # ── CIS Ubuntu test target ──────────────────────────────────────────────────
  # A purpose-built container that simulates a Ubuntu 22.04 system for testing
  # the CIS Ubuntu 22.04 benchmark hardening profile (10 rules).
  # It is NOT a real OS — it uses a JSON state file + mock shell commands so
  # that Aegis can safely run evaluate / remediate / rollback against it.
  #
  # SSH access:  host=cis-ubuntu-target  port=22 (mapped to host 2222)
  #              username=aegis-test  password=aegistest123
  #
  # After starting this service, run the seed script to register it in Aegis:
  #   cd projects/cis-ubuntu-target/seed
  #   pip install requests
  #   python seed_instance.py --password <admin-password>
  cis-ubuntu-target:
    build: ./projects/cis-ubuntu-target
    restart: unless-stopped
    container_name: cis-ubuntu-target
    hostname: cis-ubuntu-target
    ports:
      - "2222:22"
    volumes:
      - cis_ubuntu_state:/aegis-state
    networks:
      - default
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /aegis-state/state.json"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  reports_data:
  cis_ubuntu_state:
